apiVersion: batch/v1
kind: Job 
metadata:
  name: job_name # placeholder: this will be replaced with the datajoint key when executing
spec:
  ttlSecondsAfterFinished: 180
  parallelism: 1 # Don't want to run the same key twice in parallel
  template:
    spec:
      restartPolicy: Never
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
      hostNetwork: true # Allow the pod to use the host network for internet access
      affinity: 
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/role
                operator: NotIn # Key must not be in the following:
                values:
                - control-plane
              - key: kubernetes.io/hostname
                operator: NotIn
                values: 
                - jr-compute002
                - jr-compute004
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: ramtype
                    operator: In
                    values:
                      - low
              weight: 90
      containers:
      - name: container_name # placeholder: is programmatically replaced with value from table
        image: image_url # placeholder
        resources:
          requests:
            cpu: n_cpu # placeholder
            memory: memory # placeholder
            nvidia.com/gpu: n_gpu # placeholder
          limits:
            memory: mem_limit # placeholder
            nvidia.com/gpu: gpu_limit # placeholder
        env:
        - name: MY_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: MY_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: DJ_PASS
          valueFrom:
            secretKeyRef:
              name: populate-service-credentials
              key: DJ_PASS
        - name: DJ_USER
          valueFrom:
            secretKeyRef:
              name: populate-service-credentials
              key: DJ_USER
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: populate-service-credentials
              key: GITHUB_TOKEN
        - name: CAVECLIENT_TOKEN
          valueFrom:
            secretKeyRef:
              name: populate-service-credentials
              key: CAVECLIENT_TOKEN

        volumeMounts:
          - name: mnt-volume
            mountPath: /mnt/

        command: ["/bin/bash"]
        args: ["-c", 
          "pip install --force-reinstall --no-deps --no-cache-dir git+https://github.com/reimerlab/datasci_tools.git && \
          pip install --force-reinstall --no-cache-dir --no-deps git+https://github.com/reimerlab/mesh_tools.git && \
          pip install --force-reinstall --no-cache-dir --no-deps git+https://github.com/nihpat19/NEURD.git && \
          pip install --no-cache-dir caveclient[cv]==5.11.0 && \
          git clone https://$(GITHUB_TOKEN)@github.com/reimerlab/connects_v1dd.git &&\
          export PYTHONPATH=/home/neurd/workspace/connects_v1dd:$ &&\
          git clone https://$(GITHUB_TOKEN)@github.com/nihpat19/connects_local_pipeline_runner.git &&\
          export PYTHONPATH=/home/neurd/workspace/connects_local_pipeline_runner/connects_local_pipeline_runner:${PYTHONPATH} &&\
          echo $PYTHONPATH &&\
          cd connects_local_pipeline_runner &&\
          pip install . &&\
          cd connects_local_pipeline_runner &&\
          python3 plumbing.py"]
      volumes:
        - name: mnt-volume
          hostPath:
            path: /mnt
            type: Directory